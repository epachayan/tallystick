# hop3 -- bilateral commitment applied per hop; the intermediary RE-SIGNS.
#
# Same messages as chain3.toml, and every one is signed and acknowledged. The
# differences are exactly the ones the chain variant adds, removed:
#
#   * no message forwards another; each party holds only what its direct
#     counterparty signed
#   * each signature binds only its own object, not the parent it derives from
#   * I's report is I's own restatement of the execution (R), not E's receipt
#
# This is what most multi-agent stacks do today when each link is secured
# separately: every hop is accountable, the chain is not.

[protocol]
name = "hop3"
roles = ["P", "I", "E"]
description = "per-hop bilateral commitment; intermediary re-signs"

[objects]
G = "scope P grants to I"
S = "scope I sub-delegates to E"
X = "actions E executed"
R = "actions I reports to P"

[[message]]
name = "grant"
from = "P"
to = "I"
signed = true
binds = ["G"]
forwards = []
requires = []
checks = []

[[message]]
name = "grant_ack"
from = "I"
to = "P"
signed = true
binds = ["G"]
forwards = []
requires = ["grant"]
checks = []

[[message]]
name = "subgrant"
from = "I"
to = "E"
signed = true
binds = ["S"]
forwards = []
requires = ["grant"]
checks = []

[[message]]
name = "subgrant_ack"
from = "E"
to = "I"
signed = true
binds = ["S"]
forwards = []
requires = ["subgrant"]
checks = []

[[message]]
name = "exec_receipt"
from = "E"
to = "I"
signed = true
binds = ["X"]
forwards = []
requires = ["subgrant_ack"]
checks = []

[[message]]
name = "report"
from = "I"
to = "P"
signed = true
binds = ["R"]
forwards = []
requires = ["exec_receipt"]
checks = []

[[message]]
name = "report_ack"
from = "P"
to = "I"
signed = true
binds = ["R"]
forwards = []
requires = ["report"]
checks = []
